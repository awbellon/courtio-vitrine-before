<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wilfried Bellon — Courtio</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="vitrine.css">
<style>
html,body{margin:0;height:auto;min-height:100%;overflow-x:hidden}
.card-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 20px 40px;position:relative;z-index:2}
#stars{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.tw{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
.aurora{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora span{position:absolute;width:55%;height:170%;filter:blur(55px);opacity:.42;border-radius:50%;mix-blend-mode:screen}
.aurora span.a1{top:-30%;left:-15%;background:linear-gradient(180deg,var(--emerald),transparent 70%);animation:auroraDrift1 20s ease-in-out infinite}
.aurora span.a2{top:-30%;left:55%;background:linear-gradient(180deg,var(--mint),transparent 70%);opacity:.38;animation:auroraDrift2 24s ease-in-out infinite}
.aurora span.a3{bottom:-30%;left:60%;background:linear-gradient(180deg,transparent 30%,var(--prussian-light));opacity:.34;animation:auroraDrift1 28s ease-in-out infinite reverse}
@keyframes auroraDrift1{0%,100%{transform:translate(0,0) scaleY(1)}50%{transform:translate(18%,6%) scaleY(1.25)}}
@keyframes auroraDrift2{0%,100%{transform:translate(0,0) scaleY(1.05)}50%{transform:translate(-22%,-5%) scaleY(.9)}}
#shoots{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.shoot{position:absolute;width:0;height:0}
.shoot::before{content:"";position:absolute;top:0;left:0;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 10px 2px rgba(255,255,255,.9)}
.shoot::after{content:"";position:absolute;top:1px;left:2px;width:140px;height:1px;transform-origin:left center;background:linear-gradient(90deg,rgba(255,255,255,.85),transparent)}
@keyframes shootAcross{0%{opacity:0;transform:rotate(var(--ang)) translateX(0)}6%{opacity:1}75%{opacity:.7}100%{opacity:0;transform:rotate(var(--ang)) translateX(-320px)}}

.astro-mini{width:clamp(64px,9vw,84px);cursor:pointer;filter:drop-shadow(0 14px 30px rgba(45,190,120,.5));transition:transform .15s}
.astro-mini:hover{transform:scale(1.08) rotate(-4deg)}
.astro-mini:active{transform:scale(.94)}
.astro-line{font-size:.82rem;color:var(--mint);font-weight:600;min-height:1.4em;margin:10px 0 24px;text-align:center;transition:opacity .25s}

.pcard{width:min(420px,100%);background:rgba(255,255,255,.07);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border:1px solid rgba(255,255,255,.16);border-radius:26px;box-shadow:0 30px 80px -28px rgba(0,0,0,.55);padding:38px 30px 30px;text-align:center;position:relative;z-index:2;opacity:0;transform:translateY(20px);animation:cardIn .7s cubic-bezier(.16,1,.3,1) .1s forwards}
@keyframes cardIn{to{opacity:1;transform:none}}

.avatar-ring{width:112px;height:112px;border-radius:50%;margin:0 auto 20px;padding:3px;background:linear-gradient(135deg,var(--emerald),var(--mint),var(--prussian-light))}
.avatar-inner{width:100%;height:100%;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid var(--navy)}
.avatar-inner img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-initials{font-size:2rem;font-weight:800;color:var(--mint);letter-spacing:-.02em}

.pname{font-size:1.55rem;font-weight:800;color:#fff;letter-spacing:-.02em;margin:0}
.ptitle{font-size:.98rem;color:rgba(255,255,255,.72);font-weight:600;margin:6px 0 2px}
.porg{display:flex;justify-content:center;margin-top:16px}
.porg img{height:28px}

.pdivider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);margin:24px 0 20px}

.contact-list{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.contact-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);text-align:left;transition:background .2s,border-color .2s,transform .2s}
.contact-row:hover{background:rgba(255,255,255,.1);border-color:rgba(102,217,165,.35);transform:translateX(2px)}
.contact-row .ic{width:34px;height:34px;border-radius:9px;background:rgba(102,217,165,.16);display:flex;align-items:center;justify-content:center;flex:none}
.contact-row .ic svg{width:17px;height:17px;color:var(--mint)}
.contact-row .txt{min-width:0}
.contact-row .lbl{font-size:.7rem;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.contact-row .val{font-size:.92rem;color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pcard{position:relative}
.btn-add{position:absolute;top:20px;right:20px;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:none;background:linear-gradient(135deg,var(--emerald),var(--mint));color:#0b2116;font-weight:700;font-size:.74rem;cursor:pointer;box-shadow:0 8px 20px -6px rgba(45,190,120,.55);transition:transform .18s,box-shadow .25s;font-family:inherit;text-decoration:none;white-space:nowrap}
.btn-add:hover{color:#fff;transform:translateY(-1px);box-shadow:0 10px 24px -6px rgba(45,190,120,.7)}
.btn-add:active{transform:translateY(0) scale(.97)}
.btn-add svg{width:13px;height:13px}

.social-row{display:flex;justify-content:center;gap:12px;margin-top:20px}
.soc-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);transition:background .2s,border-color .2s,color .2s,transform .2s}
.soc-btn:hover{background:rgba(102,217,165,.18);border-color:rgba(102,217,165,.4);color:var(--mint);transform:translateY(-2px)}
.soc-btn svg{width:18px;height:18px}

.footer-mini{position:relative;z-index:2;padding:0 24px 30px;text-align:center;font-size:.78rem;color:rgba(255,255,255,.42)}
.astro-ghost{position:fixed;bottom:0;right:0;width:min(30vw,360px);opacity:.1;z-index:0;pointer-events:none;filter:saturate(0.8)}

@media (max-width:420px){.pcard{padding:32px 22px 26px;border-radius:22px}.pname{font-size:1.4rem}}
</style>
</head>
<body class="navy-bg">
<div class="aurora"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
<div id="stars"></div>
<div id="shoots"></div>

<div class="card-wrap">
<div class="pcard">
  <div class="avatar-ring">
    <div class="avatar-inner">
      <img src="https://courtio.fr/wilfried.png" alt="Wilfried Bellon" id="avatarImg" onerror="this.remove();document.getElementById('avatarFallback').style.display='flex'">
      <span class="avatar-initials" id="avatarFallback" style="display:none">WB</span>
    </div>
  </div>
  <h1 class="pname">Wilfried Bellon</h1>
  <p class="ptitle">Associé Fondateur</p>
  <span class="porg"><img src="logo-plain-light.svg" alt="Courtio"></span>

  <div class="pdivider"></div>

  <div class="contact-list">
    <a class="contact-row" href="tel:+33778843482">
      <span class="ic"><i data-lucide="phone"></i></span>
      <span class="txt"><span class="lbl">Téléphone</span><br><span class="val">07 78 84 34 82</span></span>
    </a>
    <a class="contact-row" href="mailto:wilfried.bellon@courtio.fr">
      <span class="ic"><i data-lucide="mail"></i></span>
      <span class="txt"><span class="lbl">Email</span><br><span class="val">wilfried.bellon@courtio.fr</span></span>
    </a>
    <a class="contact-row" href="https://courtio.fr" target="_blank" rel="noopener">
      <span class="ic"><i data-lucide="globe"></i></span>
      <span class="txt"><span class="lbl">Site web</span><br><span class="val">courtio.fr</span></span>
    </a>
  </div>

  <a class="btn-add" href="wilfried-bellon.vcf" download="wilfried-bellon.vcf">
    <i data-lucide="user-round-plus"></i>Ajouter
  </a>

  <div class="social-row">
    <a class="soc-btn" href="https://www.linkedin.com/in/wilfried-bellon-1a846b34/" target="_blank" rel="noopener" aria-label="LinkedIn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.03-1.85-3.03-1.85 0-2.14 1.44-2.14 2.94v5.66H9.36V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.61 0 4.28 2.38 4.28 5.47v6.27zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM3.56 20.45h3.56V9H3.56v11.45z"/></svg>
    </a>
    <a class="soc-btn" href="https://www.instagram.com/courtio" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg>
    </a>
    <a class="soc-btn" href="https://www.facebook.com/courtio" target="_blank" rel="noopener" aria-label="Facebook">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.6h2.55l.4-2.96h-2.95V8.5c0-.86.24-1.44 1.47-1.44h1.57V4.42C16.24 4.3 15.25 4.2 14.1 4.2c-2.4 0-4.05 1.46-4.05 4.15v2.09H7.5v2.96h2.55V21h3.45z"/></svg>
    </a>
  </div>
</div>

<footer class="footer-mini">© 2026 Courtio — Le courtage en plein envol.</footer>
</div>
<img src="astro.svg" class="astro-ghost" alt="" aria-hidden="true">

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
if(window.lucide) lucide.createIcons();
const starsEl=document.getElementById('stars');
for(let i=0;i<70;i++){const s=document.createElement('span');s.className='tw';const size=Math.random()*2+1;s.style.width=size+'px';s.style.height=size+'px';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*3)+'s';s.style.animationDuration=(2+Math.random()*3)+'s';starsEl.appendChild(s);}
const shootsEl=document.getElementById('shoots');
function spawnShootingStar(){
  const s=document.createElement('span');
  s.className='shoot';
  const ang=18+Math.random()*20;
  s.style.setProperty('--ang',ang+'deg');
  s.style.left=(30+Math.random()*55)+'%';
  s.style.top=(Math.random()*35)+'%';
  s.style.animation=`shootAcross ${1+Math.random()*.5}s ease-out forwards`;
  shootsEl.appendChild(s);
  setTimeout(()=>s.remove(),2000);
}
function scheduleShootingStars(){spawnShootingStar();setTimeout(scheduleShootingStars,4000+Math.random()*5000);}
setTimeout(scheduleShootingStars,1500);
</script>
</body>
</html>
